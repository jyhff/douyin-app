name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Release（手机免解压直接下载 .apk）'
        required: false
        type: boolean
        default: true

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 安装项目依赖
        run: npm ci

      - name: 类型检查 (Typecheck)
        run: npm run typecheck

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 预构建 Android 原生工程 (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Android Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 整理 APK 文件并生成 Release 信息
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/douyin-app-release.apk
            echo "Found APK: $APK_PATH"
          else
            echo "Error: APK not found!"
            exit 1
          fi

          # 计算 Release 标签和标题，避免 YAML 表达式解析异常
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_TITLE=抖音 App ${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v1.1.0-build-${RUN_NUM}" >> $GITHUB_ENV
            echo "RELEASE_TITLE=抖音 App 构建第 ${RUN_NUM} 次" >> $GITHUB_ENV
          fi

          # 写入 Release 详细说明
          cat << 'EOF' > build-output/release_notes.md
          ### 📱 抖音 App 自动构建完成
          
          - **安装包**：`douyin-app-release.apk`
          - **说明**：包含深浅色主题切换、私信聊天、评论楼中楼回复等最新功能。
          
          手机浏览器直接点击下方 Assets 中的 **`douyin-app-release.apk`** 即可直接下载安装！
          EOF

      - name: 上传构建产物 (GitHub Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: douyin-app-release-apk
          path: build-output/douyin-app-release.apk
          retention-days: 14

      - name: 发布到 GitHub Release (供手机直接下载 APK)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: build-output/release_notes.md
          files: build-output/douyin-app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
